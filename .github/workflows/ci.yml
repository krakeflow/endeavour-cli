name: ci

# Draft PR note: this drops pull_request and non-main push triggers.
# Local lefthook pre-push + optional gh signoff become the PR gate.
# Kevin reviews before merge (workflow edit).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run check
